<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>budgethelock</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: #f5f5f5;
            font-family: Georgia, "Times New Roman", serif;
        }

        header {
            border-bottom: 1px solid #333;
            padding: 20px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        nav a {
            color: #f5f5f5;
            text-decoration: none;
            margin-left: 25px;
            font-size: 17px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 100px 30px;
        }

        h1 {
            font-size: 64px;
            margin: 0 0 20px;
        }

        p {
            font-size: 20px;
            line-height: 1.6;
            color: #ccc;
        }

        .buttons {
            margin-top: 35px;
        }

        .button {
            display: inline-block;
            padding: 14px 24px;
            margin-right: 10px;
            background: #f5f5f5;
            color: #111;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
        }

        .button:hover {
            background: #ccc;
        }

        .outline {
            background: transparent;
            color: #f5f5f5;
            border: 1px solid #555;
        }

        .outline:hover {
            background: #222;
        }

        footer {
            border-top: 1px solid #333;
            padding: 25px 40px;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">budgethelock</div>

        <nav>
            <a href="index.html">Home</a>
            <a href="games.html">Games</a>
            <a href="projects.html">Projects</a>
        </nav>
    </header>

    <main>
        <h1>budgethelock</h1>

        <p>
            Games, projects, and other stuff I make.
        </p>

        <div class="buttons">
            <a class="button" href="games.html">View Games</a>
            <a class="button outline" href="projects.html">Projects</a>
        </div>
    </main>

    <footer>
        © 2026 budgethelock
    </footer>

</body>
</html>
