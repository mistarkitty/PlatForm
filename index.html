<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BUDGETHELOCK PRODUCTIONS</title>
    <link rel="icon" type="image/png" href="favicon.png">

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1101933241418136"
         crossorigin="anonymous"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: #eee;
            font-family: Tahoma, Arial, sans-serif;
        }

        header {
            padding: 22px 40px;
            background: #1b1b1b;
            border-bottom: 1px solid #555;
            box-shadow: 0 2px 5px #000;
        }

        .logo {
            display: inline-block;
            padding: 6px 10px;
            font-size: 22px;
            font-weight: bold;
            color: #fff;
            background: #252525;
            border: 1px solid #666;
            border-radius: 6px;
            box-shadow:
                inset 1px 1px 0 #444,
                inset -1px -1px 0 #111;
        }

        main {
            max-width: 900px;
            margin: 45px auto;
            padding: 35px 40px;
            background: #1b1b1b;
            border: 1px solid #555;
            border-radius: 8px;
            box-shadow:
                0 3px 10px #000,
                inset 1px 1px 0 #333;
        }

        h1 {
            margin: 0 0 18px;
            font-size: 40px;
            color: #fff;
        }

        p {
            max-width: 600px;
            margin: 0;
            color: #ccc;
            font-size: 17px;
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            margin-top: 28px;
            padding: 9px 20px;
            background: #2b2b2b;
            color: #fff;
            text-decoration: none;
            font-size: 15px;
            border: 1px solid #777;
            border-radius: 6px;
            box-shadow:
                inset 1px 1px 0 #555,
                inset -1px -1px 0 #111,
                0 1px 2px #000;
        }

        .button:hover {
            background: #3a3a3a;
        }

        .button:active {
            background: #222;
            box-shadow:
                inset 1px 1px 3px #000;
        }

        footer {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 40px;
            color: #777;
            font-size: 12px;
            text-align: center;
        }

        .newest-release {
            max-width: 900px;
            margin: 0 auto 35px;
            padding: 25px 40px;
            background: #1b1b1b;
            border: 1px solid #555;
            border-radius: 8px;
            box-shadow:
                0 3px 10px #000,
                inset 1px 1px 0 #333;
        }

        .release-title {
            margin-bottom: 12px;
            font-size: 14px;
            font-weight: bold;
            color: #aaa;
        }

        .newest-release h2 {
            margin: 0 0 18px;
            font-size: 27px;
            color: #fff;
        }

        .release-thumbnail {
            display: block;
            width: 100%;
            max-width: 500px;
            height: auto;
            margin-bottom: 18px;
            border: 1px solid #555;
            border-radius: 6px;
        }

        .release-description {
            margin-bottom: 20px;
        }

        .contact-button {
            display: inline-block;
            margin-left: 12px;
            padding: 5px 12px;
            background: #2b2b2b;
            color: #fff;
            text-decoration: none;
            font-size: 12px;
            border: 1px solid #777;
            border-radius: 5px;
            box-shadow:
                inset 1px 1px 0 #555,
                inset -1px -1px 0 #111,
                0 1px 2px #000;
        }

        .contact-button:hover {
            background: #3a3a3a;
        }

        .contact-button:active {
            background: #222;
        }
    </style>
</head>

<body>

    <header>
        <a class="logo" href="index.html">BUDGETHELOCK</a>
    </header>

    <main>
        <h1>Hey, I'm BUDGETHELOCK.</h1>

        <p>
            Games, projects, and other stuff I make.
        </p>

        <a class="button" href="projects.html">Projects</a>
    </main>

    <div class="newest-release">

        <div class="release-title">NEWEST RELEASE!</div>

        <h2>PlatForm</h2>

        <img
            class="release-thumbnail"
            src="newest-release.png"
            alt="Project thumbnail"
        >

        <p class="release-description">
            <i>Build your own levels, share your own levels, have fun</i>
        </p>

        <a class="button" href="platform.html">
            View Project
        </a>

    </div>

    <footer>
        © 2026 BUDGETHELOCK
        <a
            class="contact-button"
            href="https://mail.google.com/mail/?view=cm&fs=1&to=mistarkitty67@gmail.com"
            target="_blank"
        >
            Contact Me
        </a>
    </footer>

</body>
</html>
